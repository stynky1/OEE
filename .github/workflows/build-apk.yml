name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Repo-ul contine doar lib/, pubspec.yaml si tool/. Scheletul Android se genereaza aici.
      - name: Genereaza scheletul Android
        run: flutter create --platforms=android --org ro.oee --project-name oee .

      # flutter create adauga test/widget_test.dart care refera MyApp (inexistent la noi) -> analyze ar esua.
      - name: Sterge testul generat
        run: rm -rf test

      - name: Permisiuni BLE + serviciu foreground
        run: python3 tool/patch_manifest.py android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: Build APK
        run: flutter build apk --release

      # Semnare cu cheia fixa (secretele KEYSTORE_BASE64, KEYSTORE_PASSWORD si, optional, KEYSTORE_ALIAS din GitHub; alias implicit: oee).
      # Fara secrete, APK-ul ramane semnat cu cheia de debug, generata nou la fiecare build.
      - name: Semneaza APK cu cheia fixa
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "Secretele lipsesc: APK-ul ramane semnat cu cheia de debug."
            exit 0
          fi
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          echo "apksigner din: $BT"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/oee.p12"
          APK_DIR=build/app/outputs/flutter-apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/oee.p12" --ks-key-alias "${KS_ALIAS:-erka}" \
            --ks-pass env:KS_PASS --out "$APK_DIR/oee-signed.apk" "$APK_DIR/app-release.apk"
          "$BT/apksigner" verify --print-certs "$APK_DIR/oee-signed.apk"
          mv "$APK_DIR/oee-signed.apk" "$APK_DIR/app-release.apk"
          rm -f "$RUNNER_TEMP/oee.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: oee-apk
          path: build/app/outputs/flutter-apk/app-release.apk
